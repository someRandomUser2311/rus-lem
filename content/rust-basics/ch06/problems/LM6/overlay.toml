[[tests]]
key = "t38"
part = 4
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks"], message = "Use only what Chapters 1–6 teach: enums, Option, match, if let and let...else are fine, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, and no adapters that take closures, such as map, and_then, filter or collect." },
  { check = "uses", what = ["variant_shape:Available", "variant_shape:Borrowed{member_id:u32,due_day:u32}", "variant_shape:Lost", "derive:Debug", "derive:Clone", "derive:Copy", "derive:PartialEq"], inside = "enum:Status", message = "Keep `Status` exactly as supplied: `#[derive(Debug, Clone, Copy, PartialEq)]` with `Available`, `Borrowed { member_id: u32, due_day: u32 }` and `Lost`." },
  { check = "uses", what = ["field:id:u32", "field:title:String", "field:author:String", "field:year:u16", "field:status:Status"], inside = "struct:Book", message = "`Book` keeps its LM5 fields and adds `pub status: Status`." },
  { check = "uses", what = ["field:id:u32", "field:name:String", "field:premium:bool", "field:borrowed:u8"], inside = "struct:Member", message = "Keep `Member` exactly as in LM5." },
  { check = "uses", what = ["recv:ref"], within = "is_available", message = "`is_available` must take `&self`." },
  { check = "uses", what = ["recv:ref"], within = "borrower", message = "`borrower` must take `&self`." },
  { check = "uses", what = ["recv:mut", "call:due_day", "call:can_borrow"], within = "checkout", message = "`checkout` takes `&mut self`, checks `member.can_borrow()` and computes the due day with LM3's `due_day`." },
  { check = "uses", what = ["recv:mut", "call:late_fee_cents", "call:days_late", "call:record_return"], within = "return_to_shelf", message = "`return_to_shelf` takes `&mut self`, charges LM3's `late_fee_cents(days_late(…))` and calls `member.record_return()`." },
  { check = "uses", what = ["recv:mut"], within = "mark_lost", message = "`mark_lost` must take `&mut self`." },
  { check = "uses", what = ["fn:normalize_title", "fn:sort_key", "fn:title_matches", "fn:due_day", "fn:days_late", "fn:late_fee_cents", "fn:format_cents", "fn:main", "fn:summary", "fn:limit", "fn:record_borrow"], message = "Keep everything from LM5: the title helpers, the fee functions, `Book::summary`, the `Member` methods and the menu in `main`." },
]

