[[tests]]
key = "t39"
part = 4
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks"], message = "Use only what Chapters 1–6 teach: enums, Option, match, if let and let...else are fine, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, and no adapters that take closures, such as map, and_then, filter or collect." },
  { check = "uses", what = ["variant_shape:Tea", "variant_shape:Coffee", "variant_shape:Water"], inside = "enum:Item", message = "Keep `Item` exactly as supplied: the unit variants `Tea`, `Coffee` and `Water`." },
  { check = "uses", what = ["variant_shape:Nickel", "variant_shape:Dime", "variant_shape:Quarter", "variant_shape:Dollar"], inside = "enum:Coin", message = "Keep `Coin` exactly as supplied: the unit variants `Nickel`, `Dime`, `Quarter` and `Dollar`." },
  { check = "uses", what = ["field:stock:[u32;3]", "field:credit:u32"], inside = "struct:Machine", message = "Keep `Machine`'s fields exactly: `pub stock: [u32; 3]` and `pub credit: u32`." },
  { check = "uses", what = ["recv:ref", "ret:u32"], within = "price", message = "`price` must take `&self` and return `u32`." },
  { check = "uses", what = ["recv:ref", "ret:usize"], within = "index", message = "`index` must take `&self` and return `usize`." },
  { check = "uses", what = ["recv:ref", "ret:u32"], within = "cents", message = "`cents` must take `&self` and return `u32`." },
  { check = "uses", what = ["recv:none"], within = "new", message = "`Machine::new` is an associated function: no `self` parameter." },
  { check = "uses", what = ["recv:mut", "ret:Option<u32>"], within = "insert", message = "`insert` must take `&mut self` and return `Option<u32>`." },
  { check = "uses", what = ["recv:mut", "ret:Option<u32>"], within = "buy", message = "`buy` must take `&mut self` and return `Option<u32>`." },
  { check = "uses", what = ["recv:mut", "ret:u32"], within = "refund", message = "`refund` must take `&mut self` and return `u32`." },
]

