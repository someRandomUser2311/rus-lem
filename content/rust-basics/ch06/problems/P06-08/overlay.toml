[[tests]]
key = "t09"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks"], message = "Use only what Chapters 1–6 teach: enums, Option, match, if let and let...else are fine, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, and no adapters that take closures, such as map, and_then, filter or collect." },
  { check = "uses", what = ["match", "pat:Write"], within = "label", message = "`label` should `match` the borrowed event, with an arm such as `Event::Write(text)` that binds the payload." },
  { check = "forbids", what = ["call:clone", "call:to_owned"], within = "label", message = "Match on the borrowed `&Event` directly: no need to clone the event or its text." },
]

[[wrong]]
name = "debug-text"
fails = ["t05", "t06", "t07", "t08"]

[[wrong]]
name = "clones-event"
fails = ["t09"]

