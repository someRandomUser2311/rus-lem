kind = "scene"
id = "stack"
layout = "tree"
nodes = [
  { id = "report", label = "report", state = { hidden = true } },
  { id = "self", label = "self", parent = "report", state = { hidden = true } },
  { id = "main", label = "main" },
  { id = "d", label = "d", sub = "Direction", parent = "main", state = { ghost = true } },
  { id = "n", label = "n", sub = "Direction", parent = "main", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
