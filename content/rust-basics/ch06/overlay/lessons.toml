# Chapter 6 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "type" panel is the spec's Type explorer: the enum as a tree, its variants (with their
# payload shapes) as children, `sub = "variant"`. The variant a new value uses lights up.
# An "owners" / "stack" / "vars" panel is a scene of bindings; an enum value is a binding
# node whose `value` is the active variant (`North`, `Some(5)`, `None`, `Write(String)`)
# and whose `sub` is its type. A String payload's text sits in a "heap" panel, owned via a
# note ("owns → A"), as in Chapters 4 and 5. Borrows are notes ("⇢ d") with an "&" badge.
# A "flow" panel is the spec's Match flow: the `match` (or `if let`) as the root node, its
# value being the input under test, and one child node per arm, labelled `pattern => …`.
# An arm tested and rejected is lit red ("no match"); the chosen arm is lit green with a
# "chosen" badge; arms never reached are ghosted with a "skipped" badge. A binding the
# pattern creates (`state`, `i`, `other`) is a hidden child of its arm, shown when bound.
# A "calls" panel lists Option-returning calls, one node per call, value = what it returned.
# The diagrams are explanatory models: no promise about discriminant size, payload layout,
# stack placement or addresses. State panels show conceptual values, not extra output.
# Output is printed at the step whose line produces it (or the first step after it); a
# println! that runs after a screen's last step gets no output panel (as in Chapters 4–5).

