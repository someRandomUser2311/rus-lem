  { panel = "stack", op = "node", id = "d", lit = false },
  { panel = "stack", op = "node", id = "main", note = "waiting" },
  { panel = "stack", op = "node", id = "report", hidden = false, badge = "new frame" },
  { panel = "stack", op = "node", id = "self", hidden = false, lit = true, value = "&Direction", badge = "&", note = "⇢ d · is_north() → false" },
  { panel = "out", op = "print", text = "Heading West, north: false\n" },
]
[[lessons.screens.steps]]
