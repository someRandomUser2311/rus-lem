# Chapter 9 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "stack" panel is the spec's Call stack: one node per active function frame (newest
# first), `value` its locals; the frame that panics is styled red, and an unwound frame is
# ghosted. A "vals" panel holds the spec's Value boxes: one node per Result/Option, `sub`
# its type, `value` the variant and payload, green for Ok/Some and red for Err/None; the
# spec's Match flow is the arm nodes in the same panel, the matching arm lit and the
# others ghosted. stdout and stderr are two terminal panels; the exit status is a badge.
# Output is printed at the step whose line produces it.

# ---------------------------------------------------------------- L9.1
[[lessons]]
id = "L9.1"
read_more = ["ch09-00-error-handling.md", "ch09-01-unrecoverable-errors-with-panic.md"]

# Screen 1 · A panic stops the program
[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "stack"
layout = "grid"
nodes = [
  { id = "main", label = "main", sub = "frame", state = { value = "no locals" } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "stdout"
[[lessons.screens.panels]]
kind = "terminal"
id = "err"
title = "stderr"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "stack", op = "node", id = "main", lit = true, badge = "running" },
  { panel = "out", op = "print", text = "Starting up\n" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "stack", op = "node", id = "main", style = "red", badge = "panicking" },
  { panel = "err", op = "print", text = "thread 'main' panicked at src/main.rs:3:5:\ncrash and burn\n" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "stack", op = "node", id = "main", lit = false, ghost = true, badge = "unwound" },
  { panel = "err", op = "print", text = "note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace\n" },
  { panel = "err", op = "badge", text = "exit code 101" },
]

