[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["macro:assert"], message = "Check the `bool` that `fits` returns with `assert!` (and `assert!(!…)` for `false`)." },
  { check = "forbids", what = ["macro:assert_eq", "macro:assert_ne"], message = "`fits` returns a `bool`: check it with `assert!`, not `assert_eq!(…, true)`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in these tests." },
]

[[wrong]]
name = "same-size-only"
fails = ["t02", "t04", "t05", "t06"]

[[wrong]]
name = "no-taller-case"
fails = ["t02", "t06"]

[[wrong]]
name = "assert-eq-bools"
fails = ["t08"]
