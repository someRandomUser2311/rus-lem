[[tests]]
key = "t14"
run = { kind = "source" }
asserts = [{ check = "uses", what = ["call:scalar_len"], inside = "cfg_test", file = "src/lib.rs", message = "Test the private `scalar_len` from the test module in `src/lib.rs`." }]

[[tests]]
key = "t15"
run = { kind = "source" }
asserts = [{ check = "uses", what = ["mod_file:common", "attr:test", "call_path:common::unicode_fixture"], file = "tests/text_views.rs", message = "`tests/text_views.rs` needs `mod common;`, its tests, and a call of `common::unicode_fixture()`." }]

[[tests]]
key = "t16"
run = { kind = "source" }
asserts = [{ check = "uses", what = ["call:same_location"], file = "tests/text_views.rs", message = "Check that results are borrowed from the input with `same_location`, not just equal to it." }]

[[tests]]
key = "t17"
run = { kind = "source" }
asserts = [{ check = "rust_files", files = ["src/lib.rs", "tests/common/mod.rs", "tests/text_views.rs"] }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [{ check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in these tests." }]

