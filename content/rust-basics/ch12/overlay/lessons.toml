# Chapter 12 lesson visuals. Program and test output on steppers is imported from the spec
# (terminal panel `out`, printed on the last step); these add the scenes.

[[lessons]]
id = "L12.1"
read_more = ["ch12-01-accepting-command-line-arguments.md"]

[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "args"
layout = "row"
nodes = [
  { id = "a0", label = "[0]", sub = "\"target/debug/minigrep\"", state = { hidden = true } },
  { id = "a1", label = "[1]", sub = "\"test\"", state = { hidden = true } },
  { id = "a2", label = "[2]", sub = "\"sample.txt\"", state = { hidden = true } },
]
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "args", op = "node", id = "a0", hidden = false, note = "the program's path" },
  { panel = "args", op = "node", id = "a1", hidden = false },
  { panel = "args", op = "node", id = "a2", hidden = false },
]
[[lessons.screens.steps]]
n = 2
ops = [{ panel = "args", op = "node", id = "a1", lit = true, badge = "query" }]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "args", op = "node", id = "a1", lit = false },
  { panel = "args", op = "node", id = "a2", lit = true, badge = "file_path" },
]

[[lessons]]
id = "L12.2"
