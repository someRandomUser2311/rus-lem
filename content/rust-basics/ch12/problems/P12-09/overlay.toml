[[tests]]
key = "t21"
run = { kind = "suite", script = "t21" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t22"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["macro:eprintln", "call:exit"], within = "main", message = "Report errors in `main` with `eprintln!` and leave with `process::exit`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()`: report the error, or check before indexing." },
]

