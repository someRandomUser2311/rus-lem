# Chapter 1 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.

# ---------------------------------------------------------------- L1.1
[[lessons]]
id = "L1.1"
read_more = ["ch01-01-installation.md", "ch01-02-hello-world.md"]

[[lessons.screens]]
key = "s2"
panels = [{ kind = "terminal", id = "out", title = "Output" }]
steps = [
  { n = 1, ops = [{ panel = "out", op = "print", text = "Crack two eggs.\n" }] },
  { n = 2, ops = [{ panel = "out", op = "print", text = "Whisk them.\n" }] },
  { n = 3, ops = [{ panel = "out", op = "print", text = "Heat the pan.\n" }] },
  { n = 4, ops = [{ panel = "out", op = "badge", text = "Program finished" }] },
]

[[lessons.screens]]
key = "s3"
[[lessons.screens.panels]]
kind = "scene"
id = "flow"
layout = "row"
nodes = [
  { id = "src", label = "main.rs", sub = "source code · text you write", state = { style = "rust" } },
  { id = "rustc", label = "rustc", sub = "the compiler", state = { style = "blue" } },
  { id = "exe", label = "main", sub = "executable · machine code the processor runs", state = { style = "green" } },
]
edges = [
  { id = "e1", from = "src", to = "rustc", label = "translate" },
  { id = "e2", from = "rustc", to = "exe" },
]

[[lessons.screens]]
key = "s4"
[[lessons.screens.panels]]
kind = "scene"
id = "flow"
layout = "row"
nodes = [
  { id = "src", label = "main.rs", sub = "source code" },
  { id = "rustc", label = "rustc", sub = "the compiler", state = { ghost = true } },
  { id = "exe", label = "main", sub = "executable", state = { ghost = true } },
]
edges = [
  { id = "e1", from = "src", to = "rustc", label = "translate" },
  { id = "e2", from = "rustc", to = "exe" },
]
[[lessons.screens.steps]]
n = 1
ops = [{ panel = "flow", op = "node", id = "src", lit = true, style = "rust" }]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "flow", op = "node", id = "src", lit = false },
  { panel = "flow", op = "node", id = "rustc", ghost = false, lit = true, style = "blue", badge = "checking…" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "flow", op = "node", id = "rustc", lit = false, badge = "" },
  { panel = "flow", op = "node", id = "exe", ghost = false, lit = true, style = "green", badge = "new file" },
]
[[lessons.screens.steps]]
n = 4
ops = [
  { panel = "flow", op = "node", id = "exe", badge = "running" },
]

