[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:ptr_eq", "call:try_borrow_mut"], within = "transfer", message = "Check identity with `Rc::ptr_eq`, then borrow with `try_borrow_mut`." },
  { check = "forbids", what = ["call:borrow_mut", "macro:panic"], within = "transfer", message = "Report conflicts instead of panicking: no `borrow_mut` or `panic!`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "funds-before-busy"
fails = ["t07", "t16", "t17"]
