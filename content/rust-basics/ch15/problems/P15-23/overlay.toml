run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call_path:Rc::downgrade|call:downgrade|path:Rc::downgrade", "call:upgrade"], message = "Children observe parents weakly: `Rc::downgrade` and `upgrade`." },
