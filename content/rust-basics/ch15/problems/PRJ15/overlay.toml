[[tests]]
key = "t22"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:ptr_eq", "call_path:Rc::downgrade|call:downgrade"], within = "attach", message = "`attach` compares by identity and links the parent weakly." },
  { check = "uses", what = ["call:retain"], within = "detach", message = "`detach` removes the exact child with `retain`." },
