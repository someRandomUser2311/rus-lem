[[tests]]
key = "t06"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call_path:Box::new"], within = "boxed_score", message = "Put the number in a box with `Box::new`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "boxes-zero"
fails = ["t01", "t04", "t05"]
