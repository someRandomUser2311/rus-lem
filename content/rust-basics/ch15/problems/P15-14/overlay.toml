[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:try_borrow_mut"], within = "try_add", message = "Ask with `try_borrow_mut`." },
  { check = "forbids", what = ["call:borrow_mut", "macro:panic"], within = "try_add", message = "Report a busy cell instead of panicking: no `borrow_mut` or `panic!`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-saturation"
fails = ["t05"]
