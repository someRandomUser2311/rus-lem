[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:evaluate", "call:checked_add", "call:checked_mul"], within = "evaluate", message = "Evaluate recursively with checked arithmetic." },
  { check = "forbids", what = ["call:wrapping_add", "call:wrapping_mul", "call:wrapping_sub", "call:saturating_add", "call:saturating_mul", "call:saturating_sub", "macro:panic"], message = "Detect overflow; don't wrap, saturate or panic." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "wrapping-add"
fails = ["t05", "t18"]
