[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:upgrade", "call_path:Rc::downgrade|call:downgrade|path:Rc::downgrade"], within = "intern", message = "The cache stores weak handles and upgrades them." },
  { check = "uses", what = ["call:ptr_eq"], within = "identities", message = "Compare handles with `Rc::ptr_eq`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-cache"
fails = ["t01", "t02", "t07", "t08", "t10", "t11", "t13", "t15", "t17", "t18"]
