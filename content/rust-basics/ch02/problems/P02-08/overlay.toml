[[tests]]
key = "t22"
run = { kind = "suite", generator = { seed = 520, cases = 300, lines = 16, items = ["rock", "paper", "scissors", "r", "p", "s", "again", "quit", "", "Rock", "lizard", " rock "] } }
asserts = [
  { check = "checker", name = "rps" },
]

[[tests]]
key = "t23"
run = { kind = "source" }
asserts = [
  { check = "let_init", name = "computer", ty = "u32", exprs = ["rand::rng().random_range(1..=3)"], in_loop = true },
]

[[tests]]
key = "t24"
run = { kind = "source" }
asserts = [
  { check = "banned_keyword", word = "if" },
]

[[tests]]
key = "t25"
run = { kind = "suite", cases = [{ stdin = "rock\nquit\n", fixture = { computer = "1" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose rock. Computer chose rock.\nIt's a tie!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "rock\nquit\n", fixture = { computer = "2" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose rock. Computer chose paper.\nYou lose!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "rock\nquit\n", fixture = { computer = "3" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose rock. Computer chose scissors.\nYou win!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "paper\nquit\n", fixture = { computer = "1" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose paper. Computer chose rock.\nYou win!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "paper\nquit\n", fixture = { computer = "2" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose paper. Computer chose paper.\nIt's a tie!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "paper\nquit\n", fixture = { computer = "3" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose paper. Computer chose scissors.\nYou lose!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "scissors\nquit\n", fixture = { computer = "1" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose scissors. Computer chose rock.\nYou lose!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "scissors\nquit\n", fixture = { computer = "2" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose scissors. Computer chose paper.\nYou win!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }, { stdin = "scissors\nquit\n", fixture = { computer = "3" }, stdout = "Rock, paper, scissors!\nYour move (rock, paper, scissors, again, quit):\nYou chose scissors. Computer chose scissors.\nIt's a tie!\nYour move (rock, paper, scissors, again, quit):\nThanks for playing!\n" }] }
asserts = [
  { check = "same_as_reference" },
]

