[[tests]]
key = "t27"
part = 4
run = { kind = "source" }
asserts = [
  { check = "let_init", name = "secret_number", ty = "u32", exprs = ["rand::rng().random_range(1..=100)"], in_loop = false },
  { check = "match_on", method = "cmp" },
]

[[tests]]
key = "t28"
part = 4
run = { kind = "suite", generator = { seed = 672, cases = 300, lines = 13, fixture = { binding = "secret_number", pick = 100, add = 1 }, items = ["0", "101", { fixture = true }, "crab", "", "4294967296", " 42 ", "４２"], reference = true } }
asserts = [
  { check = "same_as_reference" },
]

[[tests]]
key = "t29"
part = 4
run = { kind = "process", stdin = "", stdin_pieces = [{ text = "crab\n", times = 9999 }, { text = "42\n" }], fixture = { secret_number = "42" } }
asserts = [
  { check = "stdout_pieces", pieces = [{ text = "Guess the number!\nPlease input your guess.\n" }, { text = "Please type a number!\nPlease input your guess.\n", times = 9999 }, { text = "You guessed: 42\nYou win!\n" }] },
]

[[tests]]
key = "t30"
part = 4
run = { kind = "source" }
asserts = [
  { check = "macro_mention_forbid", macros = ["print", "println", "eprint", "eprintln", "dbg", "format"], name = "secret_number" },
]

[[tests]]
key = "t31"
