mode = "cargo"
checkpoints = true
fixtures = ["secret_number"]
parts = ["Read and parse", "Compare", "Repeat", "Random secret"]

[[tests]]
key = "t01"
part = 1
run = { kind = "process", stdin = "42\n" }
asserts = [
  { check = "stdout_eq", text = "Guess the number!\nPlease input your guess.\nYou guessed: 42\nGoodbye!\n" },
]

[[tests]]
key = "t02"
part = 1
run = { kind = "process", stdin = "crab\n" }
asserts = [
  { check = "stdout_eq", text = "Guess the number!\nPlease input your guess.\nPlease type a number!\nGoodbye!\n" },
]

[[tests]]
key = "t03"
part = 2
run = { kind = "process", stdin = "20\n" }
asserts = [
  { check = "stdout_eq", text = "Guess the number!\nPlease input your guess.\nYou guessed: 20\nToo small!\nGoodbye!\n" },
]

[[tests]]
key = "t04"
part = 2
run = { kind = "process", stdin = "90\n" }
