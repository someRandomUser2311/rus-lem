  { check = "stdout_eq", text = "Guess the number!\nPlease input your guess.\nYou guessed: 20\nToo small!\nPlease input your guess.\nYou guessed: 90\nToo big!\nPlease input your guess.\nYou guessed: 42\nYou win!\n" },
]

