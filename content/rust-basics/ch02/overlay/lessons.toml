# ---------------------------------------------------------------- L2.3
[[lessons]]
id = "L2.3"
read_more = ["ch02-00-guessing-game-tutorial.md", "ch06-02-match.md"]

# Screen 1 · Conversion: turn input into a number
[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "conv"
layout = "row"
nodes = [
  { id = "text", label = "guess (text)", state = { ghost = true } },
  { id = "trimmed", label = "trim()", state = { ghost = true } },
  { id = "parsed", label = "parse()", state = { ghost = true } },
  { id = "number", label = "guess: u32", state = { ghost = true } },
]
edges = [
  { id = "e1", from = "text", to = "trimmed" },
  { id = "e2", from = "trimmed", to = "parsed" },
  { id = "e3", from = "parsed", to = "number", label = "expect" },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [{ panel = "conv", op = "node", id = "text", ghost = false, lit = true, value = '" 42\r\n"', badge = "text" }]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "conv", op = "node", id = "text", lit = false, badge = "" },
  { panel = "conv", op = "node", id = "trimmed", ghost = false, value = '"42"' },
  { panel = "conv", op = "node", id = "parsed", ghost = false, value = "Ok(42)" },
  { panel = "conv", op = "node", id = "number", ghost = false, lit = true, style = "green", value = "42", badge = "new binding" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "conv", op = "node", id = "number", lit = false, badge = "" },
  { panel = "out", op = "print", text = "Number: 42\n" },
]

