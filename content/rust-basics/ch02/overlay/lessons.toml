  { panel = "iter", op = "node", id = "parse", lit = false, style = "plain", value = "" },
  { panel = "iter", op = "node", id = "next", value = "" },
  { panel = "iter", op = "node", id = "line", lit = true, value = '"8\n"', badge = "new buffer" },
  { panel = "iter", op = "node", id = "bytes", value = "2" },
]
[[lessons.screens.steps]]
n = 4
ops = [
  { panel = "iter", op = "node", id = "line", lit = false, badge = "" },
