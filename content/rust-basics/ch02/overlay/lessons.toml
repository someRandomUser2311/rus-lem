[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "state", op = "node", id = "stdin", value = '""', badge = "consumed", ghost = true },
  { panel = "state", op = "node", id = "guess", value = '"42\n"', badge = "appended" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "state", op = "node", id = "guess", lit = false, badge = "" },
  { panel = "out", op = "print", text = "You guessed: 42\n" },
]

