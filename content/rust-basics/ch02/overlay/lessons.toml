# Screen 6 · Repetition: continue skips the rest
[[lessons.screens]]
key = "s6"
[[lessons.screens.panels]]
kind = "scene"
id = "iter"
layout = "grid"
nodes = [
  { id = "line", label = "line", state = { ghost = true } },
  { id = "bytes", label = "bytes", state = { ghost = true } },
  { id = "parse", label = "parse", state = { ghost = true } },
  { id = "next", label = "next", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "iter", op = "node", id = "line", ghost = false, lit = true, value = '"crab\n"', badge = "new buffer" },
  { panel = "iter", op = "node", id = "bytes", ghost = false, value = "5" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "iter", op = "node", id = "line", lit = false, badge = "" },
  { panel = "iter", op = "node", id = "parse", ghost = false, lit = true, style = "red", value = "Err" },
  { panel = "iter", op = "node", id = "next", ghost = false, value = "continue → loop start" },
]
