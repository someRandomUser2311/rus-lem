# ---------------------------------------------------------------- L2.2
[[lessons]]
id = "L2.2"
read_more = ["ch02-00-guessing-game-tutorial.md", "ch01-03-hello-cargo.md"]

# Screen 2 · Cargo resolves and builds dependencies
[[lessons.screens]]
key = "s2"
[[lessons.screens.panels]]
kind = "scene"
id = "flow"
layout = "row"
nodes = [
  { id = "manifest", label = "Cargo.toml", sub = "rand = \"0.10.1\"", state = { ghost = true } },
  { id = "sources", label = "crate sources", sub = "resolved versions", state = { ghost = true } },
  { id = "deps", label = "dependencies", sub = "compiled first", state = { ghost = true } },
  { id = "app", label = "your program", sub = "compiled last", state = { ghost = true } },
]
edges = [
  { id = "e1", from = "manifest", to = "sources", label = "resolve" },
  { id = "e2", from = "sources", to = "deps", label = "compile" },
  { id = "e3", from = "deps", to = "app", label = "link" },
]
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "flow", op = "node", id = "manifest", ghost = false, lit = true, style = "rust" },
  { panel = "flow", op = "node", id = "sources", ghost = false, lit = true, style = "blue", badge = "cached or downloaded" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "flow", op = "node", id = "manifest", lit = false },
  { panel = "flow", op = "node", id = "sources", lit = false, badge = "" },
  { panel = "flow", op = "node", id = "deps", ghost = false, lit = true, style = "blue" },
  { panel = "flow", op = "node", id = "app", ghost = false, lit = true, style = "green" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "flow", op = "node", id = "deps", lit = false },
  { panel = "flow", op = "node", id = "app", lit = false },
  { panel = "flow", op = "node", id = "sources", lit = true, badge = "bundled + Cargo.lock", note = "offline: no download" },
]

