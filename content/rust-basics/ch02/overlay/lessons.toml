# Chapter 2 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# State panels show conceptual values (bindings, input, results), not extra program output.

# ---------------------------------------------------------------- L2.1
[[lessons]]
id = "L2.1"
read_more = ["ch02-00-guessing-game-tutorial.md", "ch03-01-variables-and-mutability.md"]

# Screen 2 · Let a value change
[[lessons.screens]]
key = "s2"
[[lessons.screens.panels]]
kind = "scene"
id = "vars"
layout = "grid"
nodes = [{ id = "guess", label = "guess", state = { ghost = true } }]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [{ panel = "vars", op = "node", id = "guess", ghost = false, lit = true, value = "5", badge = "mut" }]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "out", op = "print", text = "Before: 5\n" },
  { panel = "vars", op = "node", id = "guess", value = "8", badge = "assigned" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "vars", op = "node", id = "guess", lit = false, badge = "" },
  { panel = "out", op = "print", text = "After: 8\n" },
]

# Screen 4 · Read into the String
[[lessons.screens]]
key = "s4"
[[lessons.screens.panels]]
kind = "scene"
id = "state"
layout = "grid"
nodes = [
  { id = "stdin", label = "stdin", state = { value = '"42\n"', badge = "waiting" } },
  { id = "guess", label = "guess", state = { value = '""' } },
]
[[lessons.screens.panels]]
