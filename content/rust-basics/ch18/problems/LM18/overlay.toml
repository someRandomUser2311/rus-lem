checkpoints = true

[[tests]]
key = "t17"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["bound:Send"], inside = "trait:Plugin", message = "`Plugin` has the supertrait `Send`." },
  { check = "forbids", what = ["pub_field:plugins"], message = "Keep the plugin list private." },
  { check = "uses", what = ["call:on_event"], within = "emit", message = "Send events through `on_event`." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]
