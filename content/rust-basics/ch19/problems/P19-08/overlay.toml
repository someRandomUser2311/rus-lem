[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["index", "call:len", "call:first", "call:last", "call:get"], within = "ends", message = "Use slice patterns, not indexing or `len`/`first`/`last`." },
  { check = "forbids", what = ["index", "call:len", "call:first", "call:last", "call:get"], within = "middle", message = "Use slice patterns, not indexing or `len`/`first`/`last`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

