[[tests]]
key = "t10"
asserts = [
  { check = "manifest_eq", key = "workspace.members", value = "[\"core\", \"cli\"]" },
]

[[tests]]
key = "t11"
asserts = [
  { check = "manifest_eq", key = "cli/Cargo.toml:dependencies.amounts-core.path", value = "../core" },
]

[[tests]]
key = "t13"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["pub_use:amount::parse_amount", "pub_use:amount::total"], message = "The root re-exports `parse_amount` and `total`." },
  { check = "uses", what = ["call:total"], within = "main", message = "`main` adds the arguments up with `amounts_core::total`." },
  { check = "forbids", what = ["pub:amount"], message = "Make `amount` private; the root re-exports are the public API." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[tests]]
key = "t16"
asserts = [
  { check = "build_ok" },
]

[[tests]]
key = "t18"
asserts = [
  { check = "build_ok" },
]

[[wrong]]
name = "u32-total"
fails = ["t05", "t14"]
