  { panel = "range", op = "node", id = "pt", value = "index = 3" },
  { panel = "range", op = "node", id = "hi", value = "18446744073709551615" },
]

# Screen 5 · Choosing what overflow does
# `level` stays 255 throughout; `result` shows what each method call evaluates to.
[[lessons.screens]]
key = "s5"
[[lessons.screens.panels]]
kind = "scene"
id = "odo"
layout = "grid"
nodes = [
  { id = "level", label = "level: u8", state = { ghost = true } },
  { id = "bar", label = "range", state = { ghost = true } },
  { id = "plain", label = "level + 1", state = { hidden = true } },
  { id = "result", label = "result", state = { ghost = true } },
  { id = "flag", label = "overflow", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "odo", op = "node", id = "level", ghost = false, lit = true, value = "255" },
  { panel = "odo", op = "node", id = "bar", ghost = false, style = "red", value = "0 … 255", badge = "max" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "odo", op = "node", id = "level", lit = false },
  { panel = "odo", op = "node", id = "plain", hidden = false, style = "red", value = "debug: panic! attempt to add with overflow", note = "release: wraps to 0" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "odo", op = "node", id = "plain", hidden = true },
  { panel = "odo", op = "node", id = "bar", badge = "" },
  { panel = "odo", op = "node", id = "result", ghost = false, lit = true, value = "000", note = "wrapping_add: 255 ↺ 000" },
  { panel = "out", op = "print", text = "0\n" },
]
[[lessons.screens.steps]]
n = 4
ops = [
  { panel = "odo", op = "node", id = "result", value = "255", note = "saturating_add: stays 255" },
  { panel = "odo", op = "node", id = "bar", badge = "stopper" },
  { panel = "out", op = "print", text = "255\n" },
]
[[lessons.screens.steps]]
n = 5
ops = [
  { panel = "odo", op = "node", id = "bar", badge = "" },
  { panel = "odo", op = "node", id = "result", value = "0", note = "overflowing_add" },
  { panel = "odo", op = "node", id = "flag", ghost = false, lit = true, style = "red", value = "true" },
  { panel = "out", op = "print", text = "(0, true)\n" },
]

