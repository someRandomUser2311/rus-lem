# Screen 2 · Calling a function
# Call stack: frames listed newest first, so a called function sits on top of `main`.
[[lessons.screens]]
key = "s2"
[[lessons.screens.panels]]
kind = "scene"
id = "stack"
layout = "tree"
nodes = [
  { id = "greet", label = "greet", state = { hidden = true } },
  { id = "main", label = "main", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "stack", op = "node", id = "main", ghost = false, lit = true },
  { panel = "out", op = "print", text = "Hello from main\n" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "stack", op = "node", id = "main", lit = false, note = "calls greet ↑" },
  { panel = "stack", op = "node", id = "greet", hidden = false, badge = "new frame" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "stack", op = "node", id = "greet", lit = true, badge = "" },
  { panel = "out", op = "print", text = "Hi there!\n" },
]
[[lessons.screens.steps]]
n = 4
ops = [
  { panel = "stack", op = "node", id = "greet", hidden = true, lit = false },
  { panel = "stack", op = "node", id = "main", note = "" },
]
[[lessons.screens.steps]]
n = 5
ops = [
  { panel = "stack", op = "node", id = "main", note = "calls greet ↑" },
  { panel = "stack", op = "node", id = "greet", hidden = false, lit = true, badge = "new frame" },
  { panel = "out", op = "print", text = "Hi there!\n" },
]
[[lessons.screens.steps]]
n = 6
ops = [
  { panel = "stack", op = "node", id = "greet", hidden = true, lit = false, badge = "" },
  { panel = "stack", op = "node", id = "main", ghost = true, note = "program ends" },
]

