# Chapter 3 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# State panels show conceptual values (bindings, types, results), not extra program output.
# The named-box diagrams model bindings and scopes; they do not claim a memory layout.

# ---------------------------------------------------------------- L3.1
[[lessons]]
id = "L3.1"
read_more = ["ch03-00-common-programming-concepts.md", "ch03-01-variables-and-mutability.md"]

