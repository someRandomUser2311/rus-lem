  { panel = "types", op = "node", id = "r8", note = "i8: 8 bits, first bit = sign" },
  { panel = "range", op = "node", id = "lo", value = "-128" },
  { panel = "range", op = "node", id = "pt", value = "signed = -128" },
  { panel = "range", op = "node", id = "hi", value = "127" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "types", op = "node", id = "r8", lit = false, note = "" },
  { panel = "types", op = "node", id = "r32", lit = true, badge = "default", note = "i32" },
  { panel = "range", op = "node", id = "lo", value = "-2147483648" },
