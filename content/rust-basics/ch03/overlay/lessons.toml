# Screen 3 · Integer types and their ranges
# `types`: one row per size (signed / unsigned names); `range`: min, the marked binding, max.
# The program's println! is on line 6, after the last step, so there is no output panel.
[[lessons.screens]]
key = "s3"
[[lessons.screens.panels]]
kind = "scene"
id = "types"
layout = "tree"
nodes = [
  { id = "r8", label = "8-bit", state = { value = "i8 / u8" } },
  { id = "r16", label = "16-bit", state = { value = "i16 / u16" } },
  { id = "r32", label = "32-bit", state = { value = "i32 / u32" } },
  { id = "r64", label = "64-bit", state = { value = "i64 / u64" } },
  { id = "r128", label = "128-bit", state = { value = "i128 / u128" } },
  { id = "rarch", label = "arch", state = { value = "isize / usize" } },
]
[[lessons.screens.panels]]
kind = "scene"
id = "range"
layout = "row"
nodes = [
  { id = "lo", label = "min", state = { ghost = true } },
  { id = "pt", label = "marker", state = { ghost = true } },
  { id = "hi", label = "max", state = { ghost = true } },
]
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "types", op = "node", id = "r8", lit = true, note = "u8: ■■■■■■■■ 8 bits" },
  { panel = "range", op = "node", id = "lo", ghost = false, value = "0" },
  { panel = "range", op = "node", id = "pt", ghost = false, lit = true, value = "small = 255" },
  { panel = "range", op = "node", id = "hi", ghost = false, value = "255" },
]
[[lessons.screens.steps]]
