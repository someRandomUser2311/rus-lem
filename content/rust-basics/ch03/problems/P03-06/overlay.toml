[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["cast:f64"], within = "main", message = "Convert the Celsius value with `c as f64` and do the formula on that `f64` value." },
]

[[tests]]
key = "t13"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["let_ty:f64"], within = "main", message = "Give the Fahrenheit result an explicit type: `let fahrenheit: f64 = …;`." },
]

[[wrong]]
name = "integer-formula"
fails = ["t05", "t06"]

[[wrong]]
name = "no-cast"
fails = ["t12"]

[[wrong]]
name = "no-annotation"
fails = ["t13"]

[[wrong]]
name = "one-decimal"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t10", "t11"]
