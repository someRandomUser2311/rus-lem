[[tests]]
key = "t12"
run = { kind = "suite", script = "t12" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t13"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["for_range", "op:+"], within = "sum_range", message = "Add up the values with a `for` loop over the range `1..=n` in `sum_range`." },
  { check = "uses", what = ["op:+"], within = "sum_range", inside = "for_range", message = "Add up the values with a `for` loop over the range `1..=n` in `sum_range`." },
]

[[wrong]]
