[[tests]]
key = "t39"
part = 4
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["ident:LOAN_DAYS", "ident:PREMIUM_LOAN_DAYS"], within = "due_day", message = "Choose the loan duration in `due_day` from the constants `LOAN_DAYS` and `PREMIUM_LOAN_DAYS`." },
  { check = "uses", what = ["ident:FEE_CAP_CENTS"], within = "late_fee_cents", message = "Cap the fee in `late_fee_cents` with the constant `FEE_CAP_CENTS`." },
  { check = "forbids", what = ["float"], message = "Keep money in whole cents with integer arithmetic; don't use `f64` or decimal literals." },
]

