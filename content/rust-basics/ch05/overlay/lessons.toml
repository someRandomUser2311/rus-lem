# Chapter 5 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "type" panel is the spec's Type explorer: the struct as a tree, its fields (and any
# methods / associated functions) as children, with field types in `sub`.
# An "owners" / "stack" panel is a scene of bindings; a struct instance is a binding node
# with its fields as child nodes (tree layout), or a single value string like
# `Rectangle { width: 30, height: 50 }` when the fields are not the point.
# A "heap" panel holds the text buffers that String fields own; ownership is a note
# ("owns → A"). Borrows are notes ("⇢ rect1" shared, "⇒ c" exclusive) with "&" / "&mut"
# badges. Moved or dropped bindings and fields are ghosted with a badge.
# The diagrams are explanatory models: no promise about field layout, addresses or capacity.
# State panels show conceptual values, not extra program output. A println! that runs
# after a screen's last step gets no output panel (as in Chapter 4).

