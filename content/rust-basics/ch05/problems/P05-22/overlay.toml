[[tests]]
key = "t17"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["update", "call:clone"], within = "fork", message = "In `fork`, use struct update syntax with an explicit clone (`..self.clone()`)." },
  { check = "uses", what = ["recv:own"], within = "publish", message = "`publish` must take `self`: publishing consumes the draft." },
  { check = "uses", what = ["recv:own"], within = "into_draft", message = "`into_draft` must take `self`: it consumes the published document." },
  { check = "forbids", what = ["call:clone", "call:to_string", "call:to_owned", "call:from"], within = "publish", message = "`publish` owns the draft, so move its `title` and `text` into the `Published` value instead of copying them." },
  { check = "forbids", what = ["call:clone", "call:to_string", "call:to_owned", "call:from"], within = "into_draft", message = "`into_draft` owns the document, so move its `title` and `text` into the `Draft` instead of copying them." },
]

[[tests]]
key = "t21"
run = { kind = "suite", script = "t21" }
asserts = [{ check = "returns" }]

[[wrong]]
name = "fork-same-edition"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08", "t21"]

[[wrong]]
name = "publish-clones"
fails = ["t17"]

[[wrong]]
name = "summary-chars"
fails = ["t03", "t04", "t21"]

[[wrong]]
name = "untrimmed-title"
fails = ["t21"]

