[[tests]]
key = "t41"
part = 4
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["field:id:u32", "field:title:String", "field:author:String", "field:year:u16", "derive:Debug", "derive:Clone", "derive:PartialEq"], inside = "struct:Book", message = "Keep `Book` exactly as supplied: `#[derive(Debug, Clone, PartialEq)]` and the fields `id: u32`, `title: String`, `author: String`, `year: u16`." },
  { check = "uses", what = ["field:id:u32", "field:name:String", "field:premium:bool", "field:borrowed:u8", "derive:Debug", "derive:Clone", "derive:PartialEq"], inside = "struct:Member", message = "Keep `Member` exactly as supplied: `#[derive(Debug, Clone, PartialEq)]` and the fields `id: u32`, `name: String`, `premium: bool`, `borrowed: u8`." },
  { check = "forbids", what = ["derive:Copy"], message = "`Book` and `Member` own `String`s, so neither can derive `Copy`." },
  { check = "uses", what = ["recv:none"], within = "new", inside = "impl:Book", message = "`Book::new` is an associated function: no `self` parameter." },
  { check = "uses", what = ["call:normalize_title"], within = "new", inside = "impl:Book", message = "`Book::new` must clean the title with LM4's `normalize_title` rather than a new rule of its own." },
  { check = "uses", what = ["recv:ref"], within = "summary", message = "`summary` must take `&self`." },
  { check = "uses", what = ["recv:ref"], within = "limit", message = "`limit` must take `&self`." },
  { check = "uses", what = ["recv:ref"], within = "can_borrow", message = "`can_borrow` must take `&self`." },
  { check = "uses", what = ["recv:mut"], within = "record_borrow", message = "`record_borrow` must take `&mut self`." },
  { check = "uses", what = ["recv:mut"], within = "record_return", message = "`record_return` must take `&mut self`." },
  { check = "uses", what = ["fn:normalize_title", "fn:sort_key", "fn:title_matches", "fn:due_day", "fn:days_late", "fn:late_fee_cents", "fn:format_cents", "fn:main"], message = "Keep everything from LM4: the title helpers, LM3's fee functions and the menu in `main`." },
]

[[tests]]
key = "t43"
n = 43
visible = false
category = "edge"
input_md = "`\"\"`"
expected_md = "`\"==============================\\n  Riverside Community Library\\n==============================\\nOpen daily, 9:00 to 17:00\\n1) List books\\n2) Borrow a book\\n3) Return a book\\n4) Quit\\nChoose an option:\\nGoodbye!\\n\"`"
checks_md = "`struct.instance`: Inherited menu prints the banner once and quits cleanly on immediate EOF."
concept = "struct.instance"
part = 4
run = { kind = "process", stdin = "" }
asserts = [{ check = "stdout_eq", text = "==============================\n  Riverside Community Library\n==============================\nOpen daily, 9:00 to 17:00\n1) List books\n2) Borrow a book\n3) Return a book\n4) Quit\nChoose an option:\nGoodbye!\n" }]

