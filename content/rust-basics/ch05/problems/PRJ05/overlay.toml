[[tests]]
key = "t35"
part = 4
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["field:owner:String", "field:balance_cents:u64"], inside = "struct:BankAccount", message = "Keep `BankAccount`'s fields exactly: `pub owner: String` and `pub balance_cents: u64`." },
  { check = "uses", what = ["recv:none"], within = "new", message = "`new` is an associated function: no `self` parameter." },
  { check = "uses", what = ["recv:mut"], within = "deposit", message = "`deposit` must take `&mut self`." },
  { check = "uses", what = ["recv:mut"], within = "withdraw", message = "`withdraw` must take `&mut self`." },
  { check = "uses", what = ["recv:mut"], within = "transfer_to", message = "`transfer_to` must take `&mut self`." },
  { check = "uses", what = ["recv:ref"], within = "summary", message = "`summary` must take `&self`: it only reads the account." },
  { check = "uses", what = ["recv:own"], within = "close", message = "`close` must take `self`: closing consumes the account." },
  { check = "forbids", what = ["derive:Copy"], message = "`BankAccount` owns a `String`, so it can't derive `Copy`; keep `Debug, Clone, PartialEq`." },
  { check = "forbids", what = ["call:checked_add", "call:checked_sub", "call:checked_mul"], message = "Check `cents > u64::MAX - balance` (or `cents > balance`) before changing anything; `checked_*` returns an `Option`, which Chapter 6 teaches." },
]

