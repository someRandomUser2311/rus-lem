[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:try_lock", "call:drop"], within = "lock_states", message = "Observe with `try_lock`, then `drop` the guard." },
  { check = "uses", what = ["call:try_lock"], within = "try_bump", message = "Use `try_lock` so nothing waits." },
  { check = "forbids", what = ["call:lock"], within = "try_bump", message = "Don't wait in `try_bump`: no `lock()`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]
