[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call_path:Arc::clone|call:clone", "call:lock", "call:pop_front", "call:send", "call:drop"], within = "reverse_all", message = "Workers take jobs from the shared queue and send tagged results." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-reverse"
fails = ["t01", "t04", "t05", "t06", "t08", "t09", "t11", "t13", "t14", "t15", "t17"]
