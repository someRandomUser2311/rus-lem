[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:spawn", "call:collect", "call:join"], within = "squares", message = "Spawn every thread, collect the handles, then join them." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-square"
fails = ["t01", "t04", "t06", "t07"]
