[[tests]]
key = "t06"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:channel", "call:send", "call:recv"], within = "relay", message = "Send the text through a channel." },
  { check = "forbids", what = ["call:clone"], message = "Move the text; don't clone it." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]
