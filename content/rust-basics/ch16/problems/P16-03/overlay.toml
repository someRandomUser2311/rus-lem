[[tests]]
key = "t06"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["closure_move", "call:spawn"], within = "shout", message = "Give the thread ownership with a `move` closure." },
  { check = "forbids", what = ["call:clone"], message = "Move the text; don't clone it." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]
