[[tests]]
key = "t11"
run = { kind = "suite", script = "t11" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:scope", "call:spawn", "call:lock"], within = "withdrawals", message = "Withdraw under the lock in scoped threads." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "over-withdraw"
fails = ["t01", "t03", "t05", "t06", "t10", "t11"]
