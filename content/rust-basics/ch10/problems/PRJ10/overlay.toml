[[tests]]
key = "t37"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["closure", "call:map", "call:map_err", "call:and_then", "call:or_else", "call:unwrap_or_else", "call:ok_or_else", "call:map_or", "call:map_or_else", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:sum", "call:product", "call:sort_by", "call:sort_by_key", "call:max_by_key", "call:min_by_key", "call:retain", "call:any", "call:all", "call:position", "type:BTreeMap", "type:BTreeSet", "type:VecDeque", "dyn", "item:type", "item:static", "unsafe", "call:leak", "call:forget", "macro:include", "attr:path"], message = "Use only what Chapters 1–10 teach: generics, traits, bounds, `impl Trait` and lifetimes are new and welcome, but no closures or the methods that take one (map, filter, collect, sum, sort_by, retain, any, all, position), no `dyn` trait objects, no BTreeMap or VecDeque, no `type` aliases or statics, and no unsafe code." },
  { check = "uses", what = ["field:entries:Vec<T>"], inside = "struct:Leaderboard", message = "`Leaderboard<T>` stores its entries in the field `entries: Vec<T>`." },
  { check = "count", what = "pub_field:entries", eq = 0, inside = "struct:Leaderboard", message = "Keep `entries` private: callers go through the methods." },
  { check = "count", what = "bound:Clone|bound:Copy", eq = 0, message = "No bound may ask for `Clone` or `Copy`: the board only lends its entries out." },
  { check = "uses", what = ["fn:new", "fn:add", "fn:len"], inside = "impl_unbounded", message = "`new`, `add` and `len` sit in an `impl<T> Leaderboard<T>` block with no bounds: any type can be stored and counted." },
  { check = "count", what = "bound", eq = 0, inside = "struct:Leaderboard", message = "`struct Leaderboard<T>` has no bounds: only the ranking methods need `T: Ranked`." },
]

[[tests]]
key = "t38"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["closure", "call:map", "call:map_err", "call:and_then", "call:or_else", "call:unwrap_or_else", "call:ok_or_else", "call:map_or", "call:map_or_else", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:sum", "call:product", "call:sort_by", "call:sort_by_key", "call:max_by_key", "call:min_by_key", "call:retain", "call:any", "call:all", "call:position", "type:BTreeMap", "type:BTreeSet", "type:VecDeque", "dyn", "item:type", "item:static", "unsafe", "call:leak", "call:forget", "macro:include", "attr:path"], message = "Use only what Chapters 1–10 teach: generics, traits, bounds, `impl Trait` and lifetimes are new and welcome, but no closures or the methods that take one (map, filter, collect, sum, sort_by, retain, any, all, position), no `dyn` trait objects, no BTreeMap or VecDeque, no `type` aliases or statics, and no unsafe code." },
  { check = "forbids", what = ["closure", "call:sort_by", "call:sort_by_key", "call:map", "call:filter", "call:collect", "call:max_by_key", "call:retain", "call:any", "call:all", "call:position", "call:clone", "call:unwrap", "dyn", "unsafe"], message = "Use Chapter 10's tools only: no closures, no `sort_by`/`sort_by_key`/`map`/`filter`/`collect`/`max_by_key`/`retain`, no `.clone()` or `unwrap()`, no `dyn` and no `unsafe`." },
]

