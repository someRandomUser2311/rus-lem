# Chapter 10 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "types" panel is the spec's Type slots, Trait card or Signature: one node per generic
# box, trait method or signature, `value` the filled-in slots (orange for the first concrete
# type, purple for the second), green for a default body. A "stack" panel is the spec's Call
# stack: one node per frame, newest first, `value` its locals; a finished frame is hidden or
# ghosted. A "bars" panel is the spec's Lifetime bars: one node per variable, `value` the
# lines it is valid for; a borrow that outlives its owner turns red, one inside it green.
# The terminal is stdout; output is printed at the step whose line produces it.

