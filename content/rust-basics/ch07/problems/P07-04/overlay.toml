[[tests]]
key = "t09"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks", "macro:include", "attr:path"], message = "Use only what Chapters 1–7 teach: modules, paths, `use` and `pub use` are new and welcome, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, no closure-taking adapters such as map or filter, and no `#[path]` or `include!` to bend the module tree." },
  { check = "uses", what = ["call_path:crate::arithmetic::double", "path:super::OFFSET"], within = "absolute", file = "src/lib.rs", message = "`absolute` should call `crate::arithmetic::double` (an absolute path) and add `super::OFFSET`." },
  { check = "uses", what = ["call_path:super::arithmetic::double", "path:super::OFFSET"], within = "relative", file = "src/lib.rs", message = "`relative` should call `super::arithmetic::double` (a relative path through the parent) and add `super::OFFSET`." },
  { check = "uses", what = ["call_path:self::detail::value"], within = "nested", file = "src/lib.rs", message = "`nested` should call `self::detail::value`." },
  { check = "uses", what = ["call_path:super::super::arithmetic::double", "path:super::super::OFFSET"], within = "value", file = "src/lib.rs", message = "`detail::value` should reach the root through `super::super::` for both `arithmetic::double` and `OFFSET`." },
]

[[wrong]]
name = "relative-uses-crate"
fails = ["t09"]

[[wrong]]
name = "nested-forgets-offset"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08", "t09"]

