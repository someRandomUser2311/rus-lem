[[tests]]
key = "t15"
asserts = [{ check = "compile_error", code = "E0603", message = "A crate outside `module_lab` can still reach `implementation::stamp`. Keep `mod implementation` private and expose only the re-exports." }]

[[tests]]
key = "t16"
run = { kind = "suite", script = "t16" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t17"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks", "macro:include", "attr:path"], message = "Use only what Chapters 1–7 teach: modules, paths, `use` and `pub use` are new and welcome, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, no closure-taking adapters such as map or filter, and no `#[path]` or `include!` to bend the module tree." },
  { check = "forbids", what = ["pub:implementation"], file = "src/lib.rs", message = "`mod implementation` must stay private (no `pub`)." },
  { check = "uses", what = ["pub_use:implementation::Stamp as Ticket", "pub_use:implementation::stamp as make_ticket"], file = "src/lib.rs", message = "At the crate root, re-export with `pub use implementation::{Stamp as Ticket, stamp as make_ticket};`." },
  { check = "uses", what = ["pub_use:crate::Ticket", "pub_use:crate::make_ticket"], inside = "mod:prelude", file = "src/lib.rs", message = "`prelude` should contain `pub use crate::{Ticket, make_ticket};`." },
  { check = "uses", what = ["use:crate::prelude::*"], inside = "mod:report", file = "src/lib.rs", message = "`report` should bring the prelude in with `use crate::prelude::*;`." },
  { check = "forbids", what = ["struct:Ticket", "enum:Ticket", "fn:make_ticket"], file = "src/lib.rs", message = "Don't define a new `Ticket` or `make_ticket`: the names must come from re-exports." },
]

[[wrong]]
name = "implementation-public"
fails = ["t15", "t17"]

[[wrong]]
name = "display-with-space"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08", "t09", "t10", "t11", "t12", "t13", "t16"]

