[[tests]]
key = "t21"
asserts = [{ check = "compile_error", code = "E0603", message = "A crate outside `module_lab` can still reach `kitchen::menu::price`. Keep `mod kitchen;` private in `src/lib.rs`." }]

[[tests]]
key = "t22"
asserts = [{ check = "compile_error", code = "E0603", message = "A crate outside `module_lab` can still name `model::Dish`. Keep `mod model;` private; callers use the root re-export `Dish`." }]

[[tests]]
key = "t23"
run = { kind = "suite", script = "t23" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t24"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks", "macro:include", "attr:path"], message = "Use only what Chapters 1–7 teach: modules, paths, `use` and `pub use` are new and welcome, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, no closure-taking adapters such as map or filter, and no `#[path]` or `include!` to bend the module tree." },
  { check = "rust_files", files = ["src/lib.rs", "src/model.rs", "src/kitchen.rs", "src/kitchen/menu.rs", "src/order.rs"] },
  { check = "uses", what = ["mod_file:model", "mod_file:kitchen", "mod_file:order", "pub:order"], file = "src/lib.rs", message = "`src/lib.rs` should declare `mod model;`, `mod kitchen;` and `pub mod order;` with no bodies." },
  { check = "forbids", what = ["pub:model", "pub:kitchen"], file = "src/lib.rs", message = "`model` and `kitchen` stay private: declare them without `pub`." },
  { check = "uses", what = ["mod_file:menu", "pub:menu"], file = "src/kitchen.rs", message = "`src/kitchen.rs` should declare `pub mod menu;` (its body in `src/kitchen/menu.rs`)." },
]

[[tests]]
key = "t25"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "call:map", "call:and_then", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks", "macro:include", "attr:path"], message = "Use only what Chapters 1–7 teach: modules, paths, `use` and `pub use` are new and welcome, but no Vec or other collections, no traits or trait implementations, no explicit lifetimes, no unsafe code, no `?` operator, no closure-taking adapters such as map or filter, and no `#[path]` or `include!` to bend the module tree." },
  { check = "uses", what = ["pub_use:model::Dish", "pub_use:model::Line", "pub_use:order::receipt", "pub_use:order::total as quote", "use_group", "use_group"], file = "src/lib.rs", message = "`src/lib.rs` should re-export with `pub use model::{Dish, Line};` and `pub use order::{receipt, total as quote};`." },
  { check = "uses", what = ["item:use"], file = "src/order.rs", message = "`src/order.rs` should bring `Line` into scope with a `use` declaration." },
  { check = "uses", what = ["call_path:crate::kitchen::menu::price"], within = "price", file = "src/model.rs", message = "`Dish::price` should call `crate::kitchen::menu::price`." },
  { check = "uses", what = ["lit:200", "lit:350", "lit:500"], file = "src/kitchen/menu.rs", message = "The three prices belong in `src/kitchen/menu.rs`." },
  { check = "forbids", what = ["lit:200", "lit:350", "lit:500"], file = "src/model.rs", message = "Prices appear only in `src/kitchen/menu.rs`." },
  { check = "forbids", what = ["lit:200", "lit:350", "lit:500"], file = "src/order.rs", message = "Prices appear only in `src/kitchen/menu.rs`." },
  { check = "uses", what = ["call:total"], within = "receipt", file = "src/order.rs", message = "`receipt` should call `total`." },
]

