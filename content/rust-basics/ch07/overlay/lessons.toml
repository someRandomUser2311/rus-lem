# Chapter 7 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "tree" panel is the spec's Module tree: a package or crate as the root, its crates or
# modules as children (`sub` says which: "package", "binary crate", "library crate",
# "module", "fn", "use"), drawn by `parent`. A `pub` item carries a "pub" badge; a module
# whose body lives in another file notes that file. The node a step is about lights up; a
# path being followed lights each segment in turn, and a dashed edge is a shortcut a `use`
# creates or a call from one crate into another.
# Output is printed at the step whose line produces it.

# ---------------------------------------------------------------- L7.1
[[lessons]]
id = "L7.1"
read_more = ["ch07-00-managing-growing-projects-with-packages-crates-and-modules.md", "ch07-01-packages-and-crates.md"]

# Screen 1 · A package describes the build
[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "tree"
layout = "tree"
nodes = [
  { id = "pkg", label = "module-lab", sub = "package" },
  { id = "bin", label = "module-lab", sub = "binary crate", parent = "pkg", state = { hidden = true } },
  { id = "main", label = "main", sub = "fn", parent = "bin", state = { hidden = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "tree", op = "node", id = "pkg", lit = true, note = "Cargo.toml: name, version, edition" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "tree", op = "node", id = "pkg", lit = false, note = "" },
  { panel = "tree", op = "node", id = "bin", hidden = false, lit = true, note = "root: src/main.rs" },
  { panel = "tree", op = "node", id = "main", hidden = false },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "tree", op = "node", id = "bin", lit = false },
  { panel = "tree", op = "node", id = "main", lit = true, badge = "runs" },
  { panel = "out", op = "print", text = "binary crate\n" },
]

