# Chapter 4 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# Each spec "Owner panel" is a scene of bindings (stack frames / owners); each "data panel"
# is a scene of the text those bindings own or borrow (heap buffers, static text, bytes).
# Ownership is drawn as a row-layout edge where one owner points at one buffer; elsewhere
# it is a note ("owns → A"). Borrows are notes ("⇢ title" shared, "⇒ title" exclusive)
# with "&" / "&mut" badges. Moved or dropped values are ghosted with a badge.
# The diagrams are explanatory models: they show ptr / len / cap ≥ only where the spec
# does, and make no promise about physical placement or exact capacity.
# State panels show conceptual values, not extra program output.

# ---------------------------------------------------------------- L4.1
[[lessons]]
id = "L4.1"
read_more = ["ch04-00-understanding-ownership.md", "ch04-01-what-is-ownership.md"]

# Screen 1 · Instructions, literals and runtime data
# One step, on line 3; the println! on line 4 runs after it, so there is no output panel.
[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "owners"
layout = "grid"
nodes = [
  { id = "literal", label = "literal", state = { value = "&str", note = "reads the program text" } },
  { id = "owned", label = "owned", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "scene"
id = "data"
layout = "grid"
nodes = [
  { id = "stat", label = "static text", state = { value = "hi" } },
  { id = "buf", label = "owned buffer", state = { ghost = true } },
]
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "owners", op = "node", id = "owned", ghost = false, lit = true, value = "String", note = "owns separate, mutable text" },
  { panel = "data", op = "node", id = "buf", ghost = false, lit = true, value = "hi", note = "a copy of the literal's text" },
]

# Screen 3 · Calls add frames; returns remove them
# Call stack: frames listed newest first, so add_one sits on top of `main`.
[[lessons.screens]]
key = "s3"
[[lessons.screens.panels]]
kind = "scene"
id = "stack"
layout = "tree"
nodes = [
  { id = "add_one", label = "add_one", state = { hidden = true } },
  { id = "n", label = "n", parent = "add_one", state = { hidden = true } },
  { id = "next", label = "next", parent = "add_one", state = { hidden = true } },
  { id = "main", label = "main" },
  { id = "start", label = "start", parent = "main", state = { ghost = true } },
  { id = "result", label = "result", parent = "main", state = { ghost = true } },
]
[[lessons.screens.panels]]
kind = "scene"
id = "heap"
layout = "grid"
nodes = [{ id = "none", label = "heap", state = { value = "—", note = "no owned heap buffer in this example" } }]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [{ panel = "stack", op = "node", id = "start", ghost = false, lit = true, value = "7" }]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "stack", op = "node", id = "start", lit = false },
  { panel = "stack", op = "node", id = "main", note = "waiting" },
  { panel = "stack", op = "node", id = "add_one", hidden = false, badge = "new frame" },
  { panel = "stack", op = "node", id = "n", hidden = false, value = "7" },
  { panel = "stack", op = "node", id = "next", hidden = false, lit = true, value = "8" },
]
[[lessons.screens.steps]]
n = 3
