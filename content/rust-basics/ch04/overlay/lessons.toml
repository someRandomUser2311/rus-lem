# Screen 1 · Follow the ownership arrow
# Two bindings, one heap buffer; the owner arrow moves from s1 to s2.
# Row edges only join neighbours, so `s2_wait` is the unbound s2 placeholder shown
# before s1; on the move it is swapped for `s2`, which sits between s1 and the buffer.
[[lessons.screens]]
key = "s1"
[[lessons.screens.panels]]
kind = "scene"
id = "own"
layout = "row"
nodes = [
  { id = "s2_wait", label = "s2", state = { ghost = true, value = "unbound" } },
  { id = "s1", label = "s1", sub = "String", state = { ghost = true } },
  { id = "s2", label = "s2", sub = "String", state = { hidden = true } },
  { id = "buf", label = "heap buffer", state = { value = "h e l l o" } },
]
edges = [
  { id = "s1_buf", from = "s1", to = "buf", label = "owns", hidden = true },
  { id = "move", from = "s1", to = "s2", label = "move", hidden = true },
  { id = "s2_buf", from = "s2", to = "buf", label = "owns", hidden = true },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "own", op = "node", id = "s1", ghost = false, lit = true, value = "ptr ●\nlen 5\ncap ≥ 5" },
  { panel = "own", op = "edge", id = "s1_buf", hidden = false },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "own", op = "node", id = "s2_wait", hidden = true },
  { panel = "own", op = "edge", id = "s1_buf", hidden = true },
  { panel = "own", op = "node", id = "s1", lit = false, ghost = true, value = "", badge = "moved" },
  { panel = "own", op = "edge", id = "move", hidden = false },
  { panel = "own", op = "node", id = "s2", hidden = false, lit = true, value = "ptr ●\nlen 5\ncap ≥ 5" },
  { panel = "own", op = "edge", id = "s2_buf", hidden = false },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "own", op = "node", id = "s2", badge = "only owner" },
  { panel = "out", op = "print", text = "hello\n" },
]

