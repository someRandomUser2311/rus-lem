[[tests]]
key = "t16"
run = { kind = "fixture", main = "fn reference_trimmed(text: &str) -> &str {\n    text.trim()\n}\n\nfn main() {\n    let inputs = [\n        String::from(\"one two\"),\n        String::from(\"hello world\"),\n        String::from(\"\"),\n        String::from(\"   \"),\n        String::from(\"\\t\\n\"),\n        String::from(\"é 東京\"),\n        String::from(\"😀 x\"),\n        String::from(\"é é\"),\n        String::from(\"  first\\tlast  \"),\n        String::from(\"x\".repeat(100000)),\n        String::from(\"a　b\"),\n        String::from(\"\\0 middle\"),\n        String::from(\"a\"),\n        String::from(\"x\".repeat(99999)),\n        String::from(\"\\u{1c}a\\u{1c}\"),\n        String::from(\" \".repeat(100000)),\n    ];\n    for owned in inputs {\n        let got = trimmed(&owned);\n        let want = reference_trimmed(&owned);\n        let base = owned.as_ptr() as usize;\n        let at = got.as_ptr() as usize;\n        assert!(at >= base && at + got.len() <= base + owned.len(), \"the returned slice isn't inside the input {owned:?}\");\n        assert_eq!((at - base, got.len()), (want.as_ptr() as usize - base, want.len()), \"wrong part of {owned:?}\");\n    }\n}" }
asserts = [{ check = "stdout_eq", text = "" }]

