[[tests]]
key = "t35"
part = 4
run = { kind = "fixture", main = "fn reference_first_word(text: &str) -> &str {\n    for word in text.split_whitespace() {\n        return word;\n    }\n    &text[..0]\n}\nfn reference_longest_word(text: &str) -> &str {\n    let mut best = &text[..0];\n    let mut count = 0;\n    for word in text.split_whitespace() {\n        let n = word.chars().count();\n        if n > count {\n            best = word;\n            count = n;\n        }\n    }\n    best\n}\nfn main() {\n    let inputs = [\n        String::from(\"café 東京\"),\n        String::from(\"one two\"),\n        String::from(\"\"),\n        String::from(\" \\t　\"),\n        String::from(\"é é 😀\"),\n        String::from(\"aa bb c\"),\n        String::from(\"x\".repeat(100000)),\n        String::from(\"same same\"),\n    ];\n    for owned in inputs {\n        let got = first_word(&owned);\n        let want = reference_first_word(&owned);\n        let base = owned.as_ptr() as usize;\n        let at = got.as_ptr() as usize;\n        assert!(at >= base && at + got.len() <= base + owned.len(), \"first_word: the returned slice isn't inside the input {owned:?}\");\n        assert_eq!((at - base, got.len()), (want.as_ptr() as usize - base, want.len()), \"first_word: wrong part of {owned:?}\");\n    }\n    let inputs = [\n        String::from(\"café 東京\"),\n        String::from(\"one two\"),\n        String::from(\"\"),\n        String::from(\" \\t　\"),\n        String::from(\"é é 😀\"),\n        String::from(\"aa bb c\"),\n        String::from(\"x\".repeat(100000)),\n        String::from(\"same same\"),\n    ];\n    for owned in inputs {\n        let got = longest_word(&owned);\n        let want = reference_longest_word(&owned);\n        let base = owned.as_ptr() as usize;\n        let at = got.as_ptr() as usize;\n        assert!(at >= base && at + got.len() <= base + owned.len(), \"longest_word: the returned slice isn't inside the input {owned:?}\");\n        assert_eq!((at - base, got.len()), (want.as_ptr() as usize - base, want.len()), \"longest_word: wrong part of {owned:?}\");\n    }\n}" }
asserts = [{ check = "stdout_eq", text = "" }]

[[tests]]
key = "t36"
part = 4
run = { kind = "source" }
asserts = [
{ check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "type:Option", "call:Some", "ident:None", "item:struct", "item:enum", "item:trait", "item:impl", "item:type", "item:static", "lifetime", "unsafe", "call:leak", "call:forget", "call:map", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:skip", "call:take", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks"], message = "Use only what Chapters 1–4 teach: no Vec or other collections, no Option, no struct/enum/trait/impl definitions, no explicit lifetimes, no unsafe code, and no iterator adapters such as map, filter or collect. Plain for loops over chars, bytes, char_indices or split_whitespace, and standard String methods, are fine." },
  { check = "forbids", what = ["recursion"], message = "Process the words with loops; functions here must not call themselves." },
]

