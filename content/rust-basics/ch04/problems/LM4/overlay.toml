[[tests]]
key = "t55"
part = 4
run = { kind = "fixture", main = "fn reference_sort_key(title: &str) -> &str {\n    if title.starts_with(\"The \") {\n        &title[4..]\n    } else if title.starts_with(\"A \") {\n        &title[2..]\n    } else if title.starts_with(\"An \") {\n        &title[3..]\n    } else {\n        title\n    }\n}\nfn main() {\n    let inputs = [\n        String::from(\"The Hobbit\"),\n        String::from(\"A Tale\"),\n        String::from(\"An Essay\"),\n        String::from(\"\"),\n        String::from(\"The \"),\n        String::from(\" The Hobbit\"),\n        String::from(\"the Hobbit\"),\n        String::from(\"The The Book\"),\n        String::from(\"The\\tBook\"),\n        String::from(\"The 東京\"),\n        String::from(\"A 😀\"),\n        String::from(\"An é\"),\n    ];\n    for owned in inputs {\n        let got = sort_key(&owned);\n        let want = reference_sort_key(&owned);\n        let base = owned.as_ptr() as usize;\n        let at = got.as_ptr() as usize;\n        assert!(at >= base && at + got.len() <= base + owned.len(), \"sort_key: the returned slice isn't inside the input {owned:?}\");\n        assert_eq!((at - base, got.len()), (want.as_ptr() as usize - base, want.len()), \"sort_key: wrong part of {owned:?}\");\n    }\n}" }
asserts = [{ check = "stdout_eq", text = "" }]

[[tests]]
key = "t56"
part = 4
run = { kind = "source" }
asserts = [
{ check = "forbids", what = ["type:Vec", "type:VecDeque", "type:HashMap", "type:HashSet", "type:BTreeMap", "type:BTreeSet", "macro:vec", "type:Option", "call:Some", "ident:None", "item:struct", "item:enum", "item:trait", "item:impl", "item:type", "item:static", "lifetime", "unsafe", "call:leak", "call:forget", "call:map", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:zip", "call:skip", "call:take", "call:sum", "call:product", "call:any", "call:all", "call:position", "call:windows", "call:chunks"], message = "Use only what Chapters 1–4 teach: no Vec or other collections, no Option, no struct/enum/trait/impl definitions, no explicit lifetimes, no unsafe code, and no iterator adapters such as map, filter or collect. Plain for loops over chars, bytes, char_indices or split_whitespace, and standard String methods, are fine." },
  { check = "forbids", what = ["recursion"], message = "Process the words with loops; functions here must not call themselves." },
]

