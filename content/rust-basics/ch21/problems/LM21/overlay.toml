checkpoints = true

[[tests]]
key = "t14"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call_path:Arc::new", "call_path:Mutex::new"], within = "serve", message = "Share the library as `Arc<Mutex<Library>>`." },
  { check = "uses", what = ["call:incoming", "call:take"], within = "serve", message = "Accept `take(max_requests)` connections." },
  { check = "uses", what = ["call:write_all"], message = "Write responses with `write_all`." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe` in this problem." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]
