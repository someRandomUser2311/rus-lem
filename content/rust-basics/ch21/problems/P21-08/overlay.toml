[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:incoming", "call:take", "call:execute"], within = "serve", message = "Accept `take(max_requests)` connections and hand them to the pool." },
  { check = "uses", what = ["call:write_all"], message = "Write responses with `write_all`." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe` in this problem." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-404"
fails = ["t03", "t07", "t11"]
