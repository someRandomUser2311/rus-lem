[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:lock", "call:recv", "dyn"], message = "Boxed jobs received through a shared, locked receiver." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe` in this problem." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "lock-held"
fails = ["t03", "t07", "t09"]
