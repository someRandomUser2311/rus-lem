[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["trait_impl:Drop"], message = "Implement `Drop` for the pool." },
  { check = "uses", what = ["call:take", "call:join"], within = "stop", message = "Take the sender and the handles, then join." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe` in this problem." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-join"
fails = ["t01", "t03", "t06", "t07", "t13", "t14", "t16", "t18"]
