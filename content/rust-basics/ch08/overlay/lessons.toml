# Chapter 8 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "mem" panel is the spec's Memory diagram: stack boxes for the bindings (their `value`
# shows ptr/len/cap) and heap boxes for buffers; a freed buffer is ghosted. A "vars" panel
# is a code stepper's variable table: one node per binding, `value` its current value; a
# binding that went out of scope is ghosted. A "table" panel is a hash map: one node per
# bucket or per key, `value` the stored value. Bucket numbers are illustrative, as the spec
# says; real ones differ from run to run. Output is printed at the step whose line prints it.

# ---------------------------------------------------------------- L8.1
[[lessons]]
id = "L8.1"
read_more = ["ch08-00-common-collections.md", "ch08-01-vectors.md"]

# Screen 3 · Pushing may move the elements
[[lessons.screens]]
key = "s3"
[[lessons.screens.panels]]
kind = "scene"
id = "mem"
layout = "grid"
nodes = [
  { id = "v", label = "v", sub = "Vec<i32> (stack)", state = { value = "ptr → A · len 3 · cap 3" } },
  { id = "a", label = "buffer A", sub = "heap", state = { value = "[1, 2, 3]" } },
  { id = "b", label = "buffer B", sub = "heap", state = { hidden = true } },
]
[[lessons.screens.panels]]
kind = "terminal"
id = "out"
title = "Output"
[[lessons.screens.steps]]
n = 1
ops = [
  { panel = "mem", op = "node", id = "v", lit = true },
  { panel = "mem", op = "node", id = "a", lit = true, badge = "full" },
]
[[lessons.screens.steps]]
n = 2
ops = [
  { panel = "mem", op = "node", id = "a", lit = false, ghost = true, badge = "freed" },
  { panel = "mem", op = "node", id = "b", hidden = false, lit = true, value = "[1, 2, 3, 4, _, _]", badge = "new" },
  { panel = "mem", op = "node", id = "v", value = "ptr → B · len 4 · cap ≥ 4" },
]
[[lessons.screens.steps]]
n = 3
ops = [
  { panel = "mem", op = "node", id = "b", value = "[1, 2, 3, 4, 5, _]", badge = "" },
  { panel = "mem", op = "node", id = "v", value = "ptr → B · len 5" },
]
[[lessons.screens.steps]]
n = 4
ops = [
  { panel = "mem", op = "node", id = "v", lit = false },
  { panel = "mem", op = "node", id = "b", lit = false },
  { panel = "out", op = "print", text = "[1, 2, 3, 4, 5] has 5 elements\n" },
]

