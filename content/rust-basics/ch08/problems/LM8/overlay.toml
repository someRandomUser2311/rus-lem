[[tests]]
key = "t39"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["closure", "call:map", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:sum", "call:product", "call:sort_by", "call:sort_by_key", "call:sort_unstable_by", "call:retain", "call:unwrap_or_else", "call:and_modify", "call:or_insert_with", "type:BTreeMap", "type:BTreeSet", "type:VecDeque", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "macro:include", "attr:path"], message = "Use only what Chapters 1–8 teach: Vec, String and HashMap/HashSet with loops, match and the methods the lessons show — no closures or the adapters that take them (map, filter, collect, sort_by, retain, unwrap_or_else, and_modify), no BTreeMap or VecDeque, no traits or trait implementations, no explicit lifetimes, no unsafe code and no `?` operator." },
  { check = "rust_files", files = ["src/lib.rs", "src/fees.rs", "src/text.rs", "src/book.rs", "src/member.rs", "src/library.rs", "src/main.rs"] },
  { check = "uses", what = ["mod_file:fees", "mod_file:text", "mod_file:book", "mod_file:member", "mod_file:library", "pub:fees", "pub:text", "pub:book", "pub:member", "pub:library"], file = "src/lib.rs", message = "`src/lib.rs` declares `pub mod fees;`, `pub mod text;`, `pub mod book;`, `pub mod member;` and `pub mod library;`, each without a body." },
]

[[tests]]
key = "t40"
run = { kind = "source" }
asserts = [
  { check = "forbids", what = ["closure", "call:map", "call:filter", "call:filter_map", "call:flat_map", "call:collect", "call:fold", "call:reduce", "call:sum", "call:product", "call:sort_by", "call:sort_by_key", "call:sort_unstable_by", "call:retain", "call:unwrap_or_else", "call:and_modify", "call:or_insert_with", "type:BTreeMap", "type:BTreeSet", "type:VecDeque", "item:trait", "trait_impl", "item:type", "item:static", "lifetime", "unsafe", "try", "call:leak", "call:forget", "macro:include", "attr:path"], message = "Use only what Chapters 1–8 teach: Vec, String and HashMap/HashSet with loops, match and the methods the lessons show — no closures or the adapters that take them (map, filter, collect, sort_by, retain, unwrap_or_else, and_modify), no BTreeMap or VecDeque, no traits or trait implementations, no explicit lifetimes, no unsafe code and no `?` operator." },
  { check = "uses", what = ["pub_use:book::Book", "pub_use:book::Status", "pub_use:member::Member", "pub_use:library::Library"], file = "src/lib.rs", message = "Re-export at the root: `pub use book::{Book, Status};`, `pub use member::Member;` and `pub use library::Library;`." },
  { check = "count", what = "item:fn", eq = 0, file = "src/lib.rs", message = "`src/lib.rs` holds only module declarations and re-exports." },
  { check = "forbids", what = ["item:struct", "item:enum", "item:impl", "item:const", "item:type"], file = "src/lib.rs", message = "`src/lib.rs` holds only module declarations and re-exports." },
]

