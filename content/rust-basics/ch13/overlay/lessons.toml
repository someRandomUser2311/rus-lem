# Chapter 13 lesson visuals, authored from the "Visual state" columns of lessons.md.
# Merged onto chapter.gen.json: lessons by `id`, screens by `key`, steps by `n`.
# A "cap" panel is the spec's Borrow view: one node per binding and per closure; an edge
# from a closure to a binding is a capture, labelled `&`, `&mut` or "owns". A "belt" panel
# is the Iterator pipeline: the source's remaining items, each station, and the result.
# Output is printed at the step whose line prints it.

