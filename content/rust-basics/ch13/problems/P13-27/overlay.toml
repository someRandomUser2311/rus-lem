[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:into_iter", "call:peekable", "call:peek", "call:next"], within = "merge", message = "Merge with two peekable owning iterators: `peek` to compare, `next` to take." },
  { check = "forbids", what = ["call:sort", "call:sort_by", "call:sort_unstable", "call:clone", "call:to_string", "call:to_owned"], message = "Merge in one pass, moving each string: no sorting and no copying." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "right-wins-ties"
fails = ["t07", "t16"]
