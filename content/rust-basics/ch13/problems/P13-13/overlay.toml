[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:count"], within = "totals", message = "Count the items with `count()`." },
  { check = "uses", what = ["call:sum|call:fold"], within = "totals", message = "Add them up with `sum` or `fold`." },
  { check = "forbids", what = ["for", "while", "loop"], within = "totals", message = "Use consuming iterator methods instead of a loop." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "i32-sum"
fails = ["t05", "t06", "t07"]
