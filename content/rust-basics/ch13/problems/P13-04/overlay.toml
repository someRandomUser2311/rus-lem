[[tests]]
key = "t09"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:f"], within = "apply", message = "`apply` returns what calling `f(value)` gives." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "fn-bound"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t07", "t08", "t09"]
