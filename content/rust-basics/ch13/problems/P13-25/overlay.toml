[[tests]]
key = "t11"
run = { kind = "suite", script = "t11" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:fold", "call:entry", "call:sort_by"], within = "counts", message = "Count with `fold` and `entry`, then order with `sort_by`." },
  { check = "forbids", what = ["for", "while", "loop"], within = "counts", message = "Use `fold` instead of a loop." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "count-ascending"
fails = ["t01", "t04", "t05", "t06", "t07", "t11"]
