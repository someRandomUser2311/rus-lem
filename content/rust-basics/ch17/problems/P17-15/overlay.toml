[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call_path:Box::pin", "type:Pin", "dyn", "call:yield_now", "call:join_all"], within = "mixed_jobs", message = "Box and pin each future into a `Vec<Pin<Box<dyn Future<Output = u64>>>>` and join them." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "all-doubled"
fails = ["t01", "t04", "t07", "t08", "t09", "t10", "t11", "t13", "t14", "t16", "t17"]
