[[tests]]
key = "t11"
run = { kind = "suite", script = "t11" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:spawn_task", "call:join"], within = "both", message = "Spawn a task and `trpl::join` it with the other future." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "swapped"
fails = ["t01", "t03", "t04", "t05", "t06", "t07", "t08", "t09", "t10", "t11"]
