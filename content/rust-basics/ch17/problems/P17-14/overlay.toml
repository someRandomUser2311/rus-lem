[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["trait_impl:Future", "call:wake_by_ref|call:wake"], message = "Implement `Future` and wake before returning `Pending`." },
  { check = "uses", what = ["await"], within = "count_yields", message = "Await the future in `count_yields`." },
  { check = "forbids", what = ["unsafe"], message = "No `unsafe`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "miscount"
fails = ["t01", "t02", "t03", "t04", "t05", "t06", "t10", "t11", "t12", "t13", "t14", "t15", "t16", "t17"]
