[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:spawn_task", "async_move", "await"], within = "task_value", message = "Spawn an `async move` task and await its handle." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "doubled"
fails = ["t01", "t03", "t04", "t05", "t06", "t07"]
