[[tests]]
key = "t17"
run = { kind = "suite", script = "t17" }
asserts = [{ check = "returns" }]

[[tests]]
key = "t18"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["unsafe", "call:add"], within = "scatter", message = "Write through the raw pointer." },
  { check = "uses", what = ["unsafe", "call:add"], within = "gather", message = "Read through the raw pointer." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "no-duplicate-check"
fails = ["t03", "t04", "t14"]
