[[tests]]
key = "t08"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["call:baby_name"], within = "baby_names", message = "Call both `baby_name` functions." },
  { check = "uses", what = ["call:fly"], within = "all_flights", message = "Call each `fly`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "swapped-names"
fails = ["t01", "t06", "t07"]
