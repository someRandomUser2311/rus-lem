[[tests]]
key = "t12"
run = { kind = "source" }
asserts = [
  { check = "uses", what = ["closure_move"], within = "make_adder", message = "Return a `move` closure." },
  { check = "uses", what = ["closure_move"], within = "make_greeter", message = "Return a `move` closure." },
  { check = "uses", what = ["dyn"], within = "pick", message = "Box the closures as `dyn Fn`." },
  { check = "forbids", what = ["call:unwrap"], message = "Don't use `unwrap()` in this problem." },
]

[[wrong]]
name = "compose-reversed"
fails = ["t08", "t09"]
