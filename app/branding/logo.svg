<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2622"/>
      <stop offset="1" stop-color="#16120F"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#D2461A"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- gear: teeth via dashed thick ring, plus solid ring -->
  <circle cx="512" cy="512" r="292" fill="none" stroke="url(#rust)" stroke-width="64"
          stroke-dasharray="45.86 45.86" transform="rotate(-4 512 512)"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="url(#rust)" stroke-width="44"/>
  <!-- code brackets -->
  <g fill="none" stroke="#FFF4E8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="420,412 324,512 420,612"/>
    <polyline points="604,412 700,512 604,612"/>
    <line x1="548" y1="392" x2="476" y2="632" stroke="#FF8A3D"/>
  </g>
</svg>
